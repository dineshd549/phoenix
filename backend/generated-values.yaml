extraEnv: []
global:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: roles
            operator: In
            values:
            - orion
  autoscaling:
    averageCpuUtilization: 70
    averageMemoryUtilization: 70
    enabled: true
    maxReplicas: 1
    minReplicas: 1
  deployment:
    progressDeadlineSeconds: 600
    replicas: 1
    revisionHistoryLimit: 10
    strategy:
      maxSurge: 25%
      maxUnavailable: 25%
      type: RollingUpdate
  imagePullPolicy: Always
  nodeSelector:
    roles: orion
  secretName: fiber
  tag: v1.1.1
  tolerations: []
monitoring:
  enabled: false
persistence:
  accessMode: ReadWriteOnce
  cloudProvider: gcp
  enabled: true
  size: 10Gi
  storageClass:
    aws: gp2
    azure: default
    baremetal: local-path
    gcp: premium-rwo
service:
  apollo:
    image: dview/apollo
    resources: {}
    tag: v1.1.1
  artemis:
    image: dview/artemis
    resources: {}
    tag: v1.1.1
  cerebrumApp:
    image: dview/cerebrum
    resources: {}
    tag: v2.8.5-dev
  cerebrumWorkers:
    image: dview/cerebrum
    resources: {}
    tag: v2.8.5-dev
  cortex:
    app:
      image: dview/cortex-app
      resources:
        limits:
          cpu: 2000m
          memory: 2048Mi
        requests:
          cpu: 1000m
          memory: 1024Mi
      tag: v3.2.3
    blacklisted:
      catalogs:
      - jmx
      - system
      - tpch
      - tpcds
      - rds
      - memory
      - hive
      - sds
      - sms
      - stream
      - sense
      schemas:
      - catalog: '*'
        schema: information_schema
      - catalog: sds
        schema: exploratory
      - catalog: sds
        schema: stateless_datasets
      - catalog: adhoc
        schema: stateless_datasets
      - catalog: adhoc
        schema: exploratory
      - catalog: adhoc
        schema: datasets
      - catalog: adhoc
        schema: __stateless__
      - catalog: adhoc
        schema: account
      - catalog: adhoc
        schema: analytics
      - catalog: adhoc
        schema: default
      - catalog: adhoc
        schema: stream
      - catalog: adhoc
        schema: marketing_reporting
      - catalog: adhoc
        schema: dview
      tables:
      - catalog: some_catalog
        schema: some_schema
        table: table_d{2}
    default_user:
      email: demo@dview.io
      id: '1'
      org: dview
      role: ADMIN
      tenant: __dview__testing__
    logging:
      level: INFO
      persist: true
    pvc:
      mountPath: /mnt/cortex
      name: cortex-pvc
    worker:
      count: 3
      image: dview/cortex-worker
      resources: {}
      tag: v3.2.3
  cosmos:
    image: dview/cosmos
    resources: {}
  dex:
    image: ghcr.io/dexidp/dex:v2.37.0
    resources: {}
  dsense:
    image: dview/dsense
    resources: {}
    tag: v0.0.19
  gitSync:
    pullPolicy: IfNotPresent
    repository: k8s.gcr.io/git-sync/git-sync
    sync_ssh_repo: x
    tag: v3.2.2
    volumeRepoDestPath: repo
    volumeRepoPath: /mnt/data
  hive:
    conf:
      hiveSite:
        datanucleus.autoCreateSchema: true
        fs.s3a.access.key: x
        fs.s3a.secret.key: x
        hive.metastore.warehouse.dir: s3a://dview-nrt/aqua/warehouse
        hive_metastore_uris: thrift://hive-metastore:9083
        metastore_uris: thrift://hive-metastore:9083
    image: dview/hive3-mysql
    pullPolicy: IfNotPresent
    resources: {}
  jobviewer:
    airflow:
      baseUrl: http://airflow-webserver:8080
      host: https://airflow-dview.dview.io
    apollo:
      base_url: https://apollo.dview.io
    dbt:
      dbtArtifactsDir: /tmp/dbt_artifacts
      dbtDocsLogDir: /tmp/dbt_docs
      dbtProfileDir: /profile
      dbtProjectDir: /modeling
      dbtUIBaseUrl: https://dbtdocs.dview.io
      lineagePort: 8080
      pullPolicy: IfNotPresent
      repository: dview/jobweaver-dbt
      tag: v3.3.3
    image: dview/jobweaver
    resources: {}
    tag: v3.4.2
  kafka:
    image: dview/kafka
    replicas: 1
    tag: 3.8.0-debian-12-r3
  mirage:
    image: dview/mirage
    resources: {}
  mysql:
    host: mysql
    image: mysql
    password: root
    port: 3306
    resources: {}
    tag: 8.0
    user: root
  postgres:
    image: dview/postgres-kafka:v1.0.0
    resources: {}
  pyserve:
    image: dview/pyserve
    resources: {}
  rangeradmin:
    image: dview/ranger-admin
    resources: {}
    tag: v1.0.0
  redis:
    image: redis
    tag: 7.4.0
  tag: v1.1.1
  trinity:
    image: dview/trinity
    resources: {}
  trino:
    additionalCatalogs:
      adhoc: 'connector.name=hive

        hive.metastore.uri=thrift://hive-metastore:9083

        hive.orc.use-column-names=true

        hive.parquet.use-column-names=true

        hive.non-managed-table-writes-enabled=true

        hive.non-managed-table-creates-enabled=true

        # hive.allow-drop-table=true

        # hive.allow-rename-table=true

        hive.metastore.thrift.client.connect-timeout=30s

        hive.metastore.thrift.client.read-timeout=30s

        hive.metastore-cache-ttl=0s

        # hive.metastore-timeout=300s

        hive.recursive-directories=true

        hive.ignore-absent-partitions=true

        hive.s3.streaming.enabled=true

        hive.metastore.thrift.delete-files-on-drop=true

        '
    image: dview/trino
    ranger:
      enabled: 'true'
      endpoint: http://ranger-admin:6080
      repository_name: trino
    replicas: 1
    tag: 445
    workers: 1
