# Source: orion/templates/service/helm-schema-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: hive-schema-init
  labels:
    app.kubernetes.io/name: hive-schema-init
  annotations:
    #"helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    spec:
      nodeSelector:
        roles: orion
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: roles
                operator: In
                values:
                - orion

      restartPolicy: OnFailure

      containers:
        - name: hive-schema-init
          image: dview/hive3-mysql:v1.1.1
          command:
            - sh
            - -c
            - |
              echo "Checking Hive schema..."
              /opt/hive/bin/schematool -dbType mysql -info || \
              /opt/hive/bin/schematool -dbType mysql -initSchema
          volumeMounts:
            - name: hive-config
              mountPath: /opt/hive/conf

      volumes:
        - name: hive-config
          configMap:
            name: hive-config
