apiVersion: v1
kind: ConfigMap
metadata:
  name: hive-config
data:
  hive-site.xml: |
    <?xml version="1.0"?>
    <?xml-stylesheet type="text/xsl" href="configuration.xsl"?>
    <configuration>
      <property>
        <name>hive_metastore_uris</name>
        <value>thrift://hive-metastore:9083</value>
      </property>
      <property>
        <name>metastore_uris</name>
        <value>thrift://hive-metastore:9083</value>
      </property>
      <property>
        <name>javax.jdo.option.ConnectionURL</name>
        <value>jdbc:mysql://mysql:3306/metastore?createDatabaseIfNotExist=true</value>
      </property>
      <property>
        <name>javax.jdo.option.ConnectionDriverName</name>
        <value>com.mysql.cj.jdbc.Driver</value>
      </property>
      <property>
        <name>javax.jdo.option.ConnectionUserName</name>
        <value>root</value>
      </property>
      <property>
        <name> javax.jdo.option.ConnectionPassword</name>
        <value>root</value>
      </property>    
      <property>
        <name>hive.metastore.warehouse.dir</name>
        <value>gs://dp-dview/aqua/warehouse</value>
      </property> 
      <property>
        <name>fs.gs.impl</name>
        <value>com.google.cloud.hadoop.fs.gcs.GoogleHadoopFileSystem</value>
      </property>
      <property>
        <name>fs.AbstractFileSystem.gs.impl</name>
        <value>com.google.cloud.hadoop.fs.gcs.GoogleHadoopFS</value>
      </property>
      <property>
        <name>fs.gs.auth.type</name>
        <value>APPLICATION_DEFAULT</value>
      </property>
      <property>
        <name>fs.gs.reported.permissions</name>
        <value>777</value>
      </property>
      <property>
        <name>fs.gs.project.id</name>
        <value>dview-gc</value>
      </property>
    </configuration>
