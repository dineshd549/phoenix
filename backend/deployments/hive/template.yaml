apiVersion: v1
kind: Service
metadata:
  name: hive-metastore
  labels:
    app.kubernetes.io/name: hive-metastore
    app.kubernetes.io/component: hive-metastore
spec:
  ports:
    - name: thrift
      port: 9083
      protocol: TCP
      targetPort: 9083
  selector:
    app.kubernetes.io/name: hive-metastore
    app.kubernetes.io/component: hive-metastore
    app.kubernetes.io/instance: "hive"
  type: ClusterIP
  sessionAffinity: None
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  internalTrafficPolicy: Cluster
