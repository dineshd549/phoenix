# Source: orion/templates/service/mysql-init-db.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init-scripts
  namespace: devops
  labels:
    k8s-app: mysql
    tenant: my-sql
    app: mysql
data:
  # Load SQL files from schemas/ directory
  00-dummy.sql: "SELECT 1;"
---
# Source: orion/templates/service/mysql.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  annotations:
        "helm.sh/resource-policy": keep 
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: 
                      premium-rwo
---
# Source: orion/templates/network/connectivity/mysql-svc.yaml
apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  selector:
    k8s-app: mysql
  ports:
    - port: 3306
      targetPort: 3306
  type: ClusterIP
---
# Source: orion/templates/service/mysql.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  labels:
    k8s-app: mysql
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      k8s-app: mysql
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25% 

  template:
    metadata:
      labels:
        k8s-app: mysql
    spec:
      volumes:
        - name: mysql
          persistentVolumeClaim:
            claimName: mysql-pvc
        - name: init-scripts
          configMap:
            name: mysql-init-scripts
            optional: true
      nodeSelector:
        roles: orion
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: roles
                operator: In
                values:
                - orion   
      containers:
        - name: mysql
          image: mysql:8
          imagePullPolicy: "Always"
          envFrom:
            - secretRef:
                name: fiber
          # env:
          #   - name: MYSQL_ROOT_PASSWORD
          #     value: root
          #   - name: MYSQL_DATABASE
          #     value: appdb
          args:
            - --server-id=1
            - --log-bin=mysql-bin
            - --binlog-format=ROW
            - --binlog-row-image=FULL
            - --log-bin-trust-function-creators=1
            # - --expire-logs-days=7
            - --max-connections=1024
            - --innodb_file_per_table=true
            - --performance-schema=ON
            - --performance-schema-instrument='stage/%=ON'
            - --performance-schema-consumer-events-stages-current=ON
            - --performance-schema-consumer-events-stages-history=ON
            - --performance-schema-consumer-events-stages-history-long=ON
          ports:
            - containerPort: 3306
              name: mysql
              protocol: TCP 
          resources:
            limits:
              cpu: 500m
              memory: 1024Mi
            requests:
              cpu: 100m
              memory: 512Mi
          volumeMounts:
            - name: mysql
              mountPath: /var/lib/mysql
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h localhost -uroot -p${MYSQL_ROOT_PASSWORD}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h localhost -uroot -p${MYSQL_ROOT_PASSWORD}
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
